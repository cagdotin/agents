codebase_concerns:
  - This domain now spans docs governance, validation/testing doctrine, and emerging task-workspace conventions. If
    tracks implementation grows, split it into a dedicated `tracks-extension` or `task-workspaces` expertise domain.
  - ARCHITECTURE repeatedly regrows into a catalog/manual. If that continues, tighten audits/review around 'major areas
    + invariants + next docs only' rather than extension-by-extension descriptions.
  - Docs drift toward handbook/telemetry mode unless policed. Keep `docs/CONTRIBUTING-DOCS.md` and docs-audit rules
    aligned with the 'non-obvious doctrine only' policy.
  - Track/workspace conventions should live in templates and validators, not just chat or expertise. If agents need
    repeated reminders about file roles/update rules, encode them into generated files and checks.
  - Repo-agnostic track design is easy to erode with convenience shortcuts. If project-specific references keep creeping
    into templates, separate generic extension assets from any repo-local overlays explicitly.
  - Skill README enforcement remains asymmetric with extension README enforcement; either document that asymmetry as
    intentional or automate it.
  - Agent-legible Zod issue mapping appears in multiple places; a shared formatter/helper would reduce wording drift.
