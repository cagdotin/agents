domain: extensions-dev
description: "Cross-extension conventions for docs-first changes, deterministic quality gates, and operator-facing Pi UX patterns"
last_synced: "2026-03-07T12:08:43Z"

scope:
  paths:
    - AGENTS.md
    - docs/
    - docs/specs/
    - extensions/
    - extensions/damage-control/
    - scripts/validate-docs.ts
    - vitest.config.ts
    - lefthook.yml

overview: |
  This repo optimizes for durable, agent-readable conventions: short entry guidance in AGENTS.md,
  deeper policy in docs/, and mechanical checks (`bun run check`) to enforce critical rules.
  Recent damage-control work established a "minimal persistent signal + drill-down panel" UX style:
  keep always-visible status compact, move detail/history into an explicit interactive view.

patterns:
  - "Keep AGENTS.md concise; move durable policy and process details into docs/."
  - "Treat docs/CONTRIBUTING-DOCS.md as canonical docs governance; delete duplicated policy text elsewhere."
  - "Use docs/specs for planned or non-trivial extension/UX/process changes before implementation."
  - "Every directory under extensions/ needs README.md (docs validation treats support dirs like __mocks__ as extension surface)."
  - "Prefer deterministic Tier 1/Tier 2 tests; avoid live model/network/runtime dependencies in unit tests."
  - "In Vitest, mock internal @mariozechner/* packages but keep real third-party libs where behavior fidelity matters."
  - "For interactive features, provide both command and shortcut entrypoints, sharing one behavior path."
  - "For safety/status UX, keep footer signal minimal and put verbose state/log inspection into a dedicated panel."

design_decisions:
  - reason: "Repository files are the long-term memory"
    detail: "Architecture, policy, and implementation intent must live in committed docs/code so future agents inherit decisions without chat archaeology."
  - reason: "Agent-legible validation over terse failures"
    detail: "Errors are expected to support autonomous correction loops by explaining what failed, why it matters, and how to fix it."
  - reason: "Deterministic tests over live dependencies"
    detail: "Fast, reproducible local/CI runs are prioritized over end-to-end realism in unit-level suites."
  - reason: "Damage-control is default-on and conservative"
    detail: "The extension targets YOLO workflows, so safeguards are baseline behavior and layered rule sources compose additively to avoid accidental weakening."
  - reason: "Observability without extra persistence"
    detail: "Damage-control runtime events stay in session custom entries (source of truth) instead of introducing a separate log file."
  - reason: "Low-noise safety signal"
    detail: "Footer state was reduced to an icon/color attention signal; users inspect details via panel only when needed."

gotchas:
  - "Use StringEnum from pi-ai for tool action enums; Type.Union(Type.Literal(...)) has hit provider compatibility issues."
  - "ctx.ui.custom() does not return until done() is called; missing/late done() can stall follow-up flows."
  - "Shortcut registration alone does not close an already-open custom panel; the panel component must handle the same key input itself."
  - "User expectation for inspect UIs is a proper bounded popup (like todo view), not a raw full-screen text overlay; otherwise readability can be poor."
  - "Tool execute() arguments are positional; ctx is the last parameter."
  - "Damage-control ask-rules must fail closed when UI is unavailable."
  - "Docs validation currently flags missing README.md in support folders under extensions/ (e.g., extensions/__mocks__/)."
  - "Expert domain routing ignores very short terms and enforces minimum-score matching; short aliases/weak keyword matches may not route."
  - "Damage-control bash mutation detection uses regex heuristics with edge cases; add tests before assuming all mutating commands are classified correctly."

references:
  - "Global rules and workflow: AGENTS.md"
  - "Canonical docs policy: docs/CONTRIBUTING-DOCS.md"
  - "Architecture map: docs/ARCHITECTURE.md"
  - "Quality posture and gate status: docs/QUALITY.md"
  - "Damage-control UX spec: docs/specs/2026-03-07-damage-control-ux-panel.md"
  - "Damage-control behavior and UX docs: extensions/damage-control/README.md"
  - "Damage-control runtime wiring: extensions/damage-control/index.ts"
  - "Damage-control panel implementation: extensions/damage-control/panel.ts"
  - "Damage-control branch-log extraction: extensions/damage-control/logs.ts"
  - "Vitest alias/mocking setup: vitest.config.ts"
  - "Shared internal test doubles: extensions/__mocks__/README.md"
  - "Pre-commit gate wiring: lefthook.yml"

codebase_concerns:
  - "Domain scope is still broad (docs governance + testing + extension API pitfalls + damage-control UX). If growth continues, split into narrower expertise domains."
  - "Docs validator infers extension-ness by directory placement under extensions/, which causes surprising README failures for internal support folders."
  - "Custom panel UX is easy to implement inconsistently; consider a shared popup/panel helper or a repo UX checklist so extensions don't reinvent unreadable overlays."
