codebase_concerns:
  - "This domain still mixes planning-governance and runtime-validation/testing conventions; split into narrower expertise domains if retrieval quality drops."
  - "Agent-friendly Zod issue mapping is repeated across modules/scripts; consider a shared formatter/helper to reduce drift in wording/hints."
  - "Boundary coverage still depends on manual sweeps (grep for YAML.parse/JSON.parse); add a lightweight lint/checklist guard so missed parsers are caught automatically."
  - "Cross-cutting doctrine spans multiple canonical docs; drift risk remains unless consistency checks are automated."
