domain: extensions-dev
description: "Patterns and conventions for building pi extensions in this project"
last_synced: "2026-03-06T22:46:23Z"

scope:
  paths:
    - extensions/

overview: |
  Extension work follows a progressive-disclosure docs model. AGENTS.md stays short
  ("where to look"), while durable guidance lives under docs/: architecture map,
  quality posture, execution plans/debt tracker, and Pi API reference. External
  inspiration is captured in docs/resources with structured frontmatter so it is
  searchable and reusable by agents. Pi runs extensions as raw TypeScript (no build
  step), so extension changes are available after reload.

patterns:
  - "Keep AGENTS.md as a table of contents, not a long instruction manual."
  - "For non-trivial recommendations or architecture/process changes, create/update an exec plan in docs/exec-plans/active with explicit reasoning and wikilink references; track unresolved items in tech-debt-tracker."
  - "Every extension directory should have a README (including small tmux extensions) so behavior, requirements, and usage are discoverable."
  - "Capture external articles/videos in docs/resources using TEMPLATE.md; include extracted links plus repository relevance."

design_decisions:
  - reason: "Single custom UI context over nested ctx.ui.custom()"
    detail: "Prefer swapping active components within one custom UI session; nested custom() flows are harder to reason about. Overlay flows are the intentional exception."
  - reason: "Compact tool rendering by default"
    detail: "Collapsed tool output should stay short and signal that richer detail is available in expanded mode."
  - reason: "Separate agent-facing and human-facing output"
    detail: "Keep tool content for the LLM plain/structured; put themed/rich formatting in renderResult for TUI users."
  - reason: "Prefer lower-cost models for helper LLM work"
    detail: "Extraction/reflection-style calls should try cheaper models first and only escalate when needed."
  - reason: "Repository docs are the system of record"
    detail: "Architecture, quality posture, API reference, and execution plans are maintained in-repo to reduce hidden conventions and onboarding friction."

gotchas:
  - "Use StringEnum from pi-ai for tool action enums; Type.Union/Type.Literal has caused provider compatibility failures."
  - "DynamicBorder color callbacks may need explicit parameter typing (e.g., (s: string) => ...); inference can fail unexpectedly."
  - "ctx.ui.custom() does not return until done() is called; wrong done() timing can deadlock async overlay/follow-up flows."
  - "Tool execute() argument order is positional; ctx is the last parameter."
  - "sendMessage(..., { triggerTurn: true }) feeds extension output back into the agent turn loop (intentional in answer-style flows)."
  - "setEditorText only pre-fills input; if you need submit-after-UI flows, end custom UI cleanly before handing control back."

references:
  - "Entry map: AGENTS.md"
  - "Architecture map: docs/ARCHITECTURE.md"
  - "Quality posture and prioritized gaps: docs/QUALITY.md"
  - "Execution plans and debt tracker: docs/exec-plans/README.md"
  - "Debt register: docs/exec-plans/tech-debt-tracker.md"
  - "Pi extension/TUI quick reference (repo-local): docs/references/pi-api-reference.md"
  - "External resource index: docs/resources/README.md"
  - "Resource capture template: docs/resources/TEMPLATE.md"
  - "Gold standard extension pattern: extensions/todos/"
