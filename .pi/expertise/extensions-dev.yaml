overview: |
  This repo treats committed docs/code as long-term memory for humans and agents.

  Stable docs should be short overviews that keep only repo-specific doctrine,
  non-obvious constraints, qualitative judgment, and pointers to deeper sources.
  If an agent can infer something quickly from code, tests, repo structure, or
  tooling output, it usually does not belong in top-level docs.

  Medium+ work defaults to both a spec (`docs/specs/`) and an execution plan
  (`docs/exec-plans/`) unless explicitly waived.

  Validation/testing defaults:
  - TypeBox + `StringEnum` at Pi tool interfaces; Zod at runtime/file/LLM boundaries.
  - Tier 1/2 tests are the active target; Tier 3 runtime-heavy coverage remains deferred.
  - `docs/TESTING.md` is a short repo-specific testing overview.
  - `docs/QUALITY.md` is for qualitative judgment and prioritized gaps, not raw counters.

patterns:
  - "Use one Zod contract per external payload, parse once, then work with trusted data."
  - "When migrating to schema-first validation, move related sibling boundaries together so one area does not mix old ad-hoc parsing with the new doctrine."
  - "For persisted user-editable or legacy data, prefer compatibility-preserving normalization over rejecting the whole payload."
  - "Validation failures should be agent-legible: say what is wrong, why it matters, and how to fix it."
  - "Skills stay repo-agnostic; project-specific tooling, paths, and package-manager rules belong in repo docs or execution context."
  - "Keep router skills thin; push substantive analysis into reusable core skills and split longer guidance into focused reference files when needed."
  - "Agent-facing docs should keep only repo-specific doctrine, invariants, judgments, and pointers. Strip tutorials, examples, inventories, status counters, and code-tour prose that code or tooling can answer."
  - "In codemap docs, point to major areas and deeper docs; do not inventory extension names or other facts an `ls`/grep can recover immediately."
  - "If a documentation rule matters, encode it in `docs/CONTRIBUTING-DOCS.md` and supporting audits/checks rather than relying on contributor memory."

design_decisions:
  - reason: "Agent-facing docs optimize for context budget"
    detail: "Top-level docs are overviews, not handbooks. If an agent can infer something quickly from code, tests, repo structure, or tooling output, it usually does not belong in stable docs."
  - reason: "ARCHITECTURE is a finger-pointing codemap"
    detail: "Its job is to orient readers to major areas, invariants, and which deeper doc to read next. It should not mirror the repo or enumerate extensions just for discoverability."
  - reason: "TESTING is doctrine, not a tutorial"
    detail: "`docs/TESTING.md` should stay a short repo-specific overview of tiers, mocks, placement, and safety boundaries. Generic Vitest advice, examples, and step-by-step cookbooks are intentionally out of scope."
  - reason: "QUALITY is judgment, not telemetry"
    detail: "`docs/QUALITY.md` should keep qualitative assessments and prioritized gaps. Raw tool-derivable counters like test totals, coverage baselines, and similar status snapshots do not belong there."
  - reason: "Qualitative testing posture still belongs in QUALITY"
    detail: "Tooling can report counts, but it cannot infer which testing gaps matter next. Keep concise testing priorities and known risks even after removing raw metrics."
  - reason: "Specs and execution plans are intentionally separate"
    detail: "Specs are relatively stable design contracts; execution plans are mutable rollout logs."
  - reason: "Hybrid validation is a deliberate tradeoff"
    detail: "Pi tool registration wants TypeBox-compatible schemas, while Zod is preferred for safer runtime parsing at external boundaries."
  - reason: "Review skill owns judgment, not mechanical validation"
    detail: "Lint/type/format/repo-rule enforcement belongs to CI/hooks. Review guidance should focus on correctness, risk, architecture, and other non-automatable concerns."
  - reason: "Core skills are composed, not embedded"
    detail: "Router skills should delegate substantive analysis to reusable skills instead of duplicating long instructions."
  - reason: "Mechanical checks should match non-obvious doctrine"
    detail: "Audit rules are worth keeping for drift humans will miss, but they should not force docs to restate facts that are already trivial to discover from the repo."
  - reason: "Module boundaries should be enforced mechanically"
    detail: "Cross-extension import constraints are important enough to check in automation rather than rely on convention memory."

gotchas:
  - "Path-targeted Biome checks can report `No files were processed` because of ignore/config interactions; repo scripts are more reliable than ad-hoc path checks."
  - "Repo-wide `bun run check` can fail on unrelated pre-existing issues; separate existing failures from regressions introduced by your change."
  - "Docs validation enforces `SKILL.md` frontmatter naming, but skill README presence is not mechanically enforced the way extension README presence is."
  - "Resource frontmatter validation intentionally treats semantically empty required values (for example `tags: []`) as missing."
  - "Shared Pi mocks are central to Tier 2 tests; a missing mock export often surfaces only as runtime `... is not a function` failures."
  - "Damage-Control blocks `rm -rf`; cleanup sometimes needs a manual/user-executed delete."

