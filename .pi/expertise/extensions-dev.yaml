domain: extensions-dev
description: "Cross-extension conventions for docs-first planning workflows, portable planning skills, and deterministic quality gates."
last_synced: "2026-03-07T13:14:44Z"

scope:
  paths:
    - AGENTS.md
    - docs/exec-plans/
    - docs/specs/
    - docs/resources/
    - skills/plan/
    - scripts/validate-docs.ts
    - lefthook.yml
    - vitest.config.ts

overview: |
  This repo treats committed docs/code as long-term memory for humans and agents.
  For medium+ work, default to two artifacts unless the user explicitly waives one:
  - spec (`docs/specs/`) for design intent
  - execution plan (`docs/exec-plans/`) for rollout state
  Execution plans are living docs (decision/progress updates during work), then moved
  from `active/` to `completed/` when done.
  The canonical execution-plan standard is shipped with the planning skill at
  `skills/plan/PLAN.md` (portable across repos). A root `PLANS.md` is not required.

patterns:
  - "Capture external guidance in `docs/resources/` as structured notes (summary + source + repo relevance), not chat-only links."
  - "For medium/large initiatives, create both spec + execution plan by default; skip one only with explicit user waiver."
  - "Create spec first, then execution plan, and cross-link both artifacts."
  - "Keep execution-plan lifecycle accurate: active while in progress, completed once exit criteria are met."
  - "Treat plans as living artifacts: keep decision/progress/blocker sections current during execution, not only at the end."
  - "If planning doctrine changes, update AGENTS + docs/exec-plans + docs/specs + `skills/plan/{SKILL.md,PLAN.md}` together."
  - "Skills must be self-sustaining: if a skill depends on a standard/template, ship it in the skill directory."
  - "Prefer mechanical enforcement (`bun run check`) over convention-memory for docs/skill invariants."
  - "Every extension under `extensions/` needs a practical README; docs validation enforces baseline coverage."

design_decisions:
  - reason: "Specs and execution plans are separate on purpose"
    detail: "Specs are relatively stable design contracts; execution plans are mutable operational logs. Separation preserves lifecycle clarity."
  - reason: "Plan underuse was treated as a trigger/policy problem, not folder topology"
    detail: "Adoption was improved via skill + AGENTS + docs policy updates; adding `docs/exec-plans/specs/` was explicitly rejected."
  - reason: "Planning standard is skill-local, not repo-root"
    detail: "User direction was to avoid root `PLANS.md`; `skills/plan/PLAN.md` is the canonical standard so the skill remains portable across repositories."
  - reason: "Skill naming follows actual behavior"
    detail: "`create-spec` was renamed to `plan` because it now produces spec and/or execution-plan artifacts; naming mismatch was causing discoverability/confusion."
  - reason: "External guidance is adapted to be tool-agnostic"
    detail: "Codex article guidance was adopted for process value, while removing product-specific wording to keep repo conventions reusable."
  - reason: "Repository artifacts are the system of record"
    detail: "Process decisions and external learnings must be committed in-repo so future agents avoid chat archaeology."

gotchas:
  - "Path-targeted Biome checks on docs/skill markdown can fail with `No files were processed` due to ignore config; rely on repo check scripts for intended coverage."
  - "Repo-wide `bun run check` can fail on unrelated baseline files (e.g., formatting drift in `skills-lock.json`); call out residual unrelated failures explicitly."
  - "If a skill depends on companion docs (e.g., `skills/plan/PLAN.md`), keep validator rules in sync with skill renames/moves or docs checks will fail."
  - "Use StringEnum for tool action enums; literal-union schemas have caused provider compatibility issues."
  - "`ctx.ui.custom()` blocks follow-up flow until `done()` is called."
  - "Vitest aliases Pi packages to local mocks; missing mock exports often surface as runtime `... is not a function` errors."

references:
  - "Global workflow policy: AGENTS.md"
  - "Execution-plan conventions/lifecycle: docs/exec-plans/README.md"
  - "Execution-plan starter scaffold: docs/exec-plans/TEMPLATE.md"
  - "Specs conventions: docs/specs/README.md"
  - "Planning skill contract: skills/plan/SKILL.md"
  - "Canonical execution-plan standard (portable): skills/plan/PLAN.md"
  - "Resource capture policy: docs/resources/README.md"
  - "Codex execution-plan source note: docs/resources/codex-exec-plans-openai.md"

codebase_concerns:
  - "Spec+plan adoption for medium/large work is still partly convention-driven; if misses continue, consider stronger mechanical prompts/checks."
  - "Recent rename (`create-spec` → `plan`) creates stale-reference risk across docs; lightweight linting for legacy skill name/path could prevent drift."
  - "This domain still mixes planning-governance guidance with Pi runtime/testing gotchas; splitting into narrower expertise files may improve retrieval precision."
