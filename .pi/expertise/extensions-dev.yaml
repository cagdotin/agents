overview: |
  This repo treats committed docs/code as long-term memory for humans and agents.
  For medium+ work, default to two artifacts unless explicitly waived:
  - spec (`docs/specs/`) for design intent
  - execution plan (`docs/exec-plans/`) for rollout state

  Validation doctrine:
  - TypeBox + `StringEnum` for Pi tool parameter contracts
  - Zod for runtime boundary parsing (YAML/JSON/frontmatter/LLM output)

  Skills are repo-agnostic instruction bundles — they must work on any repository/project, not just this one.

patterns:
  - "Use schema-first boundary validation: define one Zod contract per external payload and parse once; avoid split manual-vs-schema paths."
  - "When migrating a module to schema-first, migrate sibling boundaries in that module together to prevent doctrine drift."
  - "Keep tool registration schemas TypeBox-compatible (`StringEnum` for enums); apply Zod inside runtime parsing paths."
  - "Keep validation diagnostics agent-legible: map Zod issues to stable, actionable messages/hints instead of exposing raw parser errors."
  - "For persisted user-editable or legacy data, preserve compatibility by normalizing field-by-field instead of hard-failing whole payloads."
  - "Use a short router `SKILL.md` plus focused `references/` files when a skill spans multiple related workflows. This keeps the auto-load description compact while preserving detailed guidance on demand."

design_decisions:
  - reason: "Skills must be repo-agnostic — no tooling assumptions"
    detail: "Never embed project-specific tooling, paths, validation commands, or package manager invocations (bun/npm/etc.) into a skill or its lens/reference files. The skill defines general methodology; repo-specific behavior belongs to the invoking context or the repo's own CI/hooks."
  - reason: "Review skill owns judgment, not mechanical validation"
    detail: "Linting/type-checking/formatting/repo-specific rules belong to CI/hooks/pre-commit. The review skill focuses on non-automatable concerns (correctness gaps, security risks, architectural drift, missing edge cases, misleading docs/tests). Passing automated checks is never proof a change is good."
  - reason: "Core skills are composed, not embedded"
    detail: "`skills/review/` is the reusable analysis primitive. The merged `skills/github/` router handles commit workflow, GitHub CLI tasks, and PR-review ceremony, while its PR-review reference delegates substantive code analysis to `/skill:review`."
  - reason: "Related workflows consolidate into one router skill when prompt footprint matters"
    detail: "`commit`, `pr-review`, and `github` were merged into one `github` skill because they share context and otherwise consume three separate auto-load descriptions. Use the broader, ecosystem-specific name (`github`, not `git`) when most workflows are tied to one toolchain."
  - reason: "Specs and execution plans are intentionally separate"
    detail: "Specs are relatively stable design contracts; execution plans are mutable operational logs. Separation keeps lifecycle and ownership clear."
  - reason: "Planning standard is skill-local, not repo-root"
    detail: "Canonical plan structure lives in `skills/plan/PLAN.md` so planning behavior stays portable across repositories."
  - reason: "Hybrid validation: TypeBox for tool registration, Zod for runtime boundaries"
    detail: "Pi tool registration expects TypeBox `TSchema`; using Zod at runtime boundaries improves safety without risking tool interface compatibility."
  - reason: "Do not emit raw Zod errors to users/agents"
    detail: "Curated error/hint mapping keeps diagnostics stable, actionable, and testable across refactors."

gotchas:
  - "Path-targeted Biome checks can report `No files were processed` due ignore config; rely on repo scripts (`bun run check`) for intended coverage."
  - "Repo-wide `bun run check` may fail on unrelated dirty/baseline files; explicitly separate unrelated failures from your change."
  - "Docs validation enforces SKILL.md frontmatter (name must match directory) but does NOT enforce skill README existence — that's only enforced for extensions."
  - "In resource frontmatter validation, semantically-empty required values (e.g., `tags: []`) are intentionally reported as 'missing required frontmatter field'."
  - "Legacy todo JSON-frontmatter migration sanitizes/coerces mixed primitive types instead of strict rejection; odd legacy values may survive as normalized strings."
  - "Vitest aliases Pi packages to local mocks; missing mock exports often surface as runtime `... is not a function` errors."
  - "Implementation plans may reference repo-local validation (e.g., `bun run check:docs`) for verifying the work in *this* repo — but that must never leak into a skill's own behavior/instructions."
  - "Damage-Control blocks `rm -rf`; destructive cleanup steps in plans may need a manual/user-performed delete even when the design is otherwise complete."
  - "When generating artifacts (skill taxonomy, lens structure, etc.), trust the initial design instinct. The agent makes better taxonomy decisions during generation than during second-guessing review — avoid reopening decisions that were already correct."

