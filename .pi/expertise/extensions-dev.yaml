codebase_concerns:
  - "This domain still mixes documentation-governance knowledge with validation/testing conventions; split it if retrieval quality starts dropping."
  - "ARCHITECTURE repeatedly regrows into a catalog/manual. If that continues, tighten audits/review around 'major areas + invariants + next docs only' rather than extension-by-extension descriptions."
  - "Docs drift toward handbook/telemetry mode unless policed. Keep `docs/CONTRIBUTING-DOCS.md` and docs-audit rules aligned with the 'non-obvious doctrine only' policy."
  - "Skill README enforcement remains asymmetric with extension README enforcement; either document that asymmetry as intentional or automate it."
  - "Agent-legible Zod issue mapping appears in multiple places; a shared formatter/helper would reduce wording drift."
