domain: extensions-dev
description: "Cross-extension conventions for docs-first delivery, schema-first boundary validation, and skill architecture: TypeBox/StringEnum for tool params, Zod for runtime parsing."
last_synced: "2026-03-10T17:46:00Z"

scope:
  paths:
    - AGENTS.md
    - docs/ARCHITECTURE.md
    - docs/exec-plans/
    - docs/specs/
    - docs/resources/
    - skills/plan/
    - skills/review/
    - skills/github/
