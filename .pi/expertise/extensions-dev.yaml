domain: extensions-dev
description: "Conventions for building Pi extensions, keeping docs as source-of-truth, and maintaining test/quality gates"
last_synced: "2026-03-07T12:05:23Z"

scope:
  paths:
    - AGENTS.md
    - extensions/
    - docs/
    - scripts/validate-docs.ts
    - vitest.config.ts
    - lefthook.yml

overview: |
  This repo favors progressive-disclosure guidance (short AGENTS.md, durable policy in docs/)
  plus mechanical quality gates. Recent work established a Vitest baseline with deterministic,
  programmatic tests only (no live LLM/network usage), and integrated tests into local pre-commit flow.

patterns:
  - "Keep AGENTS.md as a concise entrypoint and global guardrails; move detailed policy to docs/."
  - "Treat docs/CONTRIBUTING-DOCS.md as canonical docs governance; remove duplicate policy text when this doc subsumes it."
  - "Use docs/specs for planned or non-trivial extension/process changes before implementation."
  - "Every directory under extensions/ must include a README.md (docs validator treats it as extension-facing surface, including support dirs like __mocks__)."
  - "For extension tests, prioritize Tier 1/Tier 2 deterministic logic tests; defer runtime-coupled integration paths explicitly."
  - "Mock internal @mariozechner/* deps in Vitest, but use real installed third-party deps (e.g., TypeBox/YAML) to keep behavior realistic."
  - "Keep quality checks runnable as one command (bun run check) and pre-commit enforced via Lefthook."
  - "Run pre-commit checks as parallel Lefthook commands (lint/docs/tests) for faster feedback while preserving full gate coverage."

design_decisions:
  - reason: "Repository docs are the system of record"
    detail: "Architecture, quality posture, API references, and specs must live in committed files (not chat-only decisions), so future agents inherit context."
  - reason: "Agent-legible validation over terse lint output"
    detail: "Failures should explain what is wrong, why it matters, and how to fix it, enabling autonomous correction loops."
  - reason: "Deterministic tests over live model/runtime dependencies"
    detail: "Unit tests intentionally avoid LLM/network/runtime invocation so CI/local runs stay fast, stable, and reproducible."
  - reason: "Guard against accidental live calls in tests"
    detail: "The shared pi-ai test mock throws by default on complete(), making unintended model invocation fail fast."
  - reason: "Damage-control is default-on"
    detail: "The package assumes fast/YOLO workflows, so safety policy is baseline behavior rather than opt-in."
  - reason: "Layered safety rules merge conservatively"
    detail: "Bundled/global/project rules compose additively in v1 to avoid accidental weakening of inherited safeguards."

gotchas:
  - "Use StringEnum from pi-ai for tool action enums; Type.Union/Type.Literal has caused provider compatibility failures."
  - "ctx.ui.custom() does not return until done() is called; incorrect done() timing can deadlock follow-up flows."
  - "Shortcut-based panel toggles need in-component key handling while custom UI is active; registering a shortcut alone does not auto-close an open custom panel."
  - "Tool execute() arguments are positional; ctx is the last parameter."
  - "sendMessage(..., { triggerTurn: true }) intentionally re-enters the agent turn loop."
  - "setEditorText only pre-fills input; it does not submit."
  - "Damage-control ask-rules must fail closed when UI is unavailable."
  - "Docs validation currently treats support folders under extensions/ as extension dirs; missing README.md in folders like extensions/__mocks__/ will fail bun run check."
  - "Expert domain routing ignores very short terms and enforces a minimum score; short aliases or keyword-only weak matches may not route."
  - "Damage-control mutation detection regex has edge cases (e.g., some standalone chmod forms), so do not assume all mutating shell commands are classified correctly without tests."

references:
  - "Repo entry + Golden Rules: AGENTS.md"
  - "Canonical docs policy: docs/CONTRIBUTING-DOCS.md"
  - "Architecture map: docs/ARCHITECTURE.md"
  - "Quality posture + notable testing findings: docs/QUALITY.md"
  - "Vitest rollout spec: docs/specs/2026-03-07-vitest-testing-infrastructure.md"
  - "Pi API quick reference (repo-focused): docs/references/pi-api-reference.md"
  - "Vitest alias/mocking setup: vitest.config.ts"
  - "Shared test doubles documentation: extensions/__mocks__/README.md"
  - "Pre-commit quality gate config: lefthook.yml"
  - "Gold-standard extension structure: extensions/todos/"

codebase_concerns:
  - "This domain still mixes docs governance, extension API pitfalls, damage-control policy, and testing infrastructure. If it grows further, split into narrower domains (e.g., docs-governance, extension-testing, damage-control)."
  - "Docs validation infers extension-ness from directory placement under extensions/ rather than explicit metadata/allowlists, which creates surprise failures for internal support folders."
