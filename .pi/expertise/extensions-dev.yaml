domain: extensions-dev
description: "Conventions for building Pi extensions and maintaining documentation/process policy in this repo"
last_synced: "2026-03-07T11:07:43Z"

scope:
  paths:
    - AGENTS.md
    - extensions/
    - docs/

overview: |
  This repo uses progressive-disclosure docs: AGENTS.md is a short entrypoint, and durable
  policy/architecture guidance lives in docs/. Documentation governance is now centralized in
  docs/CONTRIBUTING-DOCS.md (for both humans and agents), with ARCHITECTURE.md intentionally
  framed around constraints, decisions, and rationale rather than a static code tour.

patterns:
  - "Keep AGENTS.md as a table of contents, not a long instruction manual."
  - "Before applying ideas from external sources, capture them in docs/resources/ using TEMPLATE.md and add them to docs/resources/README.md."
  - "Use docs/specs for planned/complex extension work before coding; link decisions back to the initiating todo/plan."
  - "Use exec plans for cross-cutting repo/process initiatives; keep extension feature specifics in specs."
  - "Treat docs/CONTRIBUTING-DOCS.md as the canonical docs policy; retire duplicated guidance from other files when this doc subsumes it."
  - "Cross-link docs governance from key entrypoints (AGENTS.md, docs/README.md) so agents and humans find rules from normal navigation paths."
  - "Every extension directory should have a README so behavior and constraints are discoverable."
  - "After docs/process changes, run docs validation and full checks (not just spot-checking edited files)."

design_decisions:
  - reason: "Architecture docs follow decision/constraint/rationale framing"
    detail: "ARCHITECTURE.md is meant to explain boundaries and tradeoffs, not just list folders/modules."
  - reason: "Single canonical docs policy file"
    detail: "docs/CONTRIBUTING-DOCS.md centralizes doc rules (including resource usage) to reduce drift and ambiguous agent behavior."
  - reason: "Repository docs are the system of record"
    detail: "Architecture, quality posture, API references, specs, and resource captures stay in-repo to avoid hidden chat-only conventions."
  - reason: "Single custom UI context over nested ctx.ui.custom()"
    detail: "Prefer swapping active components within one custom UI session; nested custom() flows are harder to reason about. Overlay flows are the intentional exception."
  - reason: "Compact tool rendering by default"
    detail: "Collapsed tool output should stay short and signal that richer detail is available in expanded mode."
  - reason: "Separate agent-facing and human-facing output"
    detail: "Keep tool content for the LLM plain/structured; put themed/rich formatting in renderResult for TUI users."
  - reason: "Prefer lower-cost models for helper LLM work"
    detail: "Extraction/reflection-style calls should try cheaper models first and only escalate when needed."
  - reason: "Avoid redundant capability surfaces"
    detail: "If a skill already covers a workflow adequately (e.g., Linear), prefer the skill over building/maintaining a parallel extension."
  - reason: "Damage-control is default-on in this package"
    detail: "The project runs fast (YOLO) by design, so safety policy enforcement is treated as baseline behavior, not opt-in."
  - reason: "Layered safety policy sources"
    detail: "Damage-control rules compose in order: bundled extension defaults, global Pi rules, then project-local rules discovered up the directory tree."
  - reason: "Conservative v1 policy semantics for damage-control"
    detail: "Rule layering is additive-only in v1 (no inherited-rule disabling yet), and expert-extension path-policy integration is explicitly deferred."

gotchas:
  - "Use StringEnum from pi-ai for tool action enums; Type.Union/Type.Literal has caused provider compatibility failures."
  - "DynamicBorder color callbacks may need explicit parameter typing (e.g., (s: string) => ...); inference can fail unexpectedly."
  - "ctx.ui.custom() does not return until done() is called; wrong done() timing can deadlock async overlay/follow-up flows."
  - "Tool execute() argument order is positional; ctx is the last parameter."
  - "sendMessage(..., { triggerTurn: true }) feeds extension output back into the agent turn loop (intentional in answer-style flows)."
  - "setEditorText only pre-fills input; if you need submit-after-UI flows, end custom UI cleanly before handing control back."
  - "Damage-control ask-rules must fail closed when UI is unavailable (block by default)."
  - "Damage-control v1 merge is additive-only; local/global files cannot relax bundled defaults yet."

