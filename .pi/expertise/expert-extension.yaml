domain: expert-extension
description: "Self-improving domain expertise extension for pi — manages per-domain mental models as YAML files"
last_synced: "2026-03-07T00:32:00Z"

scope:
  paths:
    - extensions/expert/

overview: |
  The extension provides persistent, domain-scoped working memory via YAML files in `.pi/expertise/`.
  It combines selective injection, explicit reflection, and operator-facing controls (`/expert` + tool).
  R9 hardening focused on reliability: better domain matching metadata, context-budget-aware injection,
  and direct UX for reflection logs and domain bootstrapping.

patterns:
  - "Treat expertise headers as matching metadata, not just labels: keep `scope.paths`, `scope.patterns`, `keywords`, and `aliases` current."
  - "`related_domains` is for lightweight operator/agent hints, not automatic extra context loading."
  - "Use `/expert init` and `/expert log` for operator-driven setup/inspection instead of relying on LLM tool invocation."

design_decisions:
  - reason: "Reflection is explicit-only, never automatic"
    detail: "Auto-reflect on every cycle created latency/noise; reflection is user-triggered so learning happens when context justifies it."
  - reason: "Two-stage reflection (router → per-domain experts) is retained"
    detail: "Keeps multi-domain reflection scalable while allowing direct single-domain reflection when domain is known."
  - reason: "R9 intentionally did not redesign LLM invocation architecture"
    detail: "Hardening was scoped to matching, context budget, and command UX to reduce change risk."
  - reason: "Matching upgrades are backward-compatible"
    detail: "New metadata (`keywords`, `aliases`, `related_domains`, `scope.patterns`) is optional so existing YAML files continue to work."
  - reason: "Context-aware injection uses deterministic degradation"
    detail: "As context fills, injection behavior becomes more conservative and can fully skip at a critical threshold to avoid prompt bloat/compaction pressure."
  - reason: "Trimming is thoughtful, not aggressive"
    detail: "Expertise updates must preserve hard-won insights; do not silently drop useful knowledge just to satisfy a size target."

gotchas:
  - "If expertise appears to stop auto-loading, check context-usage thresholds first; skip behavior is intentional under high context pressure."
  - "Matching is still heuristic; missing `keywords`/`aliases` causes avoidable false negatives even with improved scoring."
  - "Router XML parsing is regex-based and can be brittle if model output format drifts."
  - "CONTENT_PRINCIPLES is a shared contract across tool docs and reflection prompt; changes have broad behavioral impact."
  - "Reflection/status UX temporarily reuses the same status key; restoration logic must always run to avoid stale status display."
  - "Session/pinned domain state is in module-level maps rebuilt from session data; lifecycle handling bugs can produce cross-session confusion."

