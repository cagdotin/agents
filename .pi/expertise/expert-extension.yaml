references:
  - "R9 spec: specs/2026-03-06-r9-expert-extension-hardening.md"
  - "Operator UX and command surface: extensions/expert/index.ts"
  - "Context-budget injection policy: extensions/expert/hooks.ts"
  - "Header parsing/settings normalization: extensions/expert/storage.ts"
  - "Matching heuristics and scope-pattern support: extensions/expert/helpers.ts"

codebase_concerns:
  - "Key policy is split across prompt text, matching heuristics, and hook-time injection logic; without focused tests/docs, behavior can regress invisibly."
  - "Reflection and routing depend on strict output-format discipline from models (XML/tags); parser fragility remains a reliability risk."
