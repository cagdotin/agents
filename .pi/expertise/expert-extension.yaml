domain: expert-extension
description: "Self-improving domain expertise extension for pi — manages per-domain mental models as YAML files"
last_synced: "2026-03-05T15:53:00Z"

scope:
  paths:
    - extensions/expert/

overview: |
  A pi extension that gives agents persistent, scoped working memory. Each "domain" is a YAML file
  in .pi/expertise/. Three capabilities: auto-injection (matches domains to prompt), explicit
  reflection (router + domain-filtered fan-out), and manual control (expertise tool + /expert command).
  Injected domains are shown per-turn in chat and cumulatively in the footer status bar,
  with persistence across session reloads via CustomMessageEntry scanning.

design_decisions:
  - reason: "In-process LLM calls, not subprocesses"
    detail: |
      Subprocesses broke: (1) no inherited auth/subscription, (2) parallel processes fight
      over global settings lock. Pattern borrowed from extensions/answer/extraction.ts.
  - reason: "Reflection is explicit-only, never automatic"
    detail: |
      Auto-reflect on agent_end was removed — it blocked next prompt, ran on every cycle
      regardless of relevance. User should control when learning happens.
  - reason: "Two-stage reflection: Router → parallel domain experts"
    detail: |
      Without domain: router identifies affected domains, then parallel per-domain reflection.
      With domain: skip router, single-domain reflection.
  - reason: "Trimming is thoughtful, not aggressive"
    detail: |
      Early versions had very aggressive trimming that caused agents to silently drop insights.
      Fixed by raising thresholds, changing language, and adding explicit pushback mechanism.
      Key principle: never silently drop insights just to meet a line target.
  - reason: "Prompts must distinguish WHY from HOW, and actively re-evaluate existing content"
    detail: |
      Without explicit guidance, reflection agents treat implementation walkthroughs as
      "architectural decisions" and preserve them forever (nothing "contradicts" a description
      of how code works). Three-part fix in REFLECTION_PROMPT + CONTENT_PRINCIPLES:
      (1) Explicit good/bad examples — "We chose X over Y because Z" vs "X calls A which does B"
      (2) Active re-evaluation of ALL entries each reflection pass, not just passive preservation
      (3) "How it works" walkthroughs added to the "does not belong" list
      Without this, expertise files accumulate stale implementation details indefinitely.
  - reason: "CustomMessageEntry serves dual purpose: visual + persistence"
    detail: |
      The sendMessage() in before_agent_start creates a CustomMessageEntry that both:
      (1) renders in chat via registerMessageRenderer (per-turn visibility)
      (2) persists in session JSONL and is scanned on session_start to rebuild state
      No separate appendEntry() call needed — avoids redundant data in the session tree.
  - reason: "setStatus over setFooter for domain tracking"
    detail: |
      setStatus("expert", text) is a lightweight key/value in the existing footer.
      setFooter() replaces the entire footer, which would kill other useful info
      (git branch, token stats, model). setStatus is ephemeral but reconstructed
      from persisted CustomMessageEntry records on every session lifecycle event.

gotchas:
  - "Router XML parse uses regex — fragile if model adds extra whitespace or attributes"
  - "scope.patterns is defined in ExpertiseHeader but currently unused"
  - "match_domains_to_prompt() is keyword-only — 'login flow' won't match 'authentication' domain"
  - "CONTENT_PRINCIPLES constant is shared across tool description, init/update responses, and REFLECTION_PROMPT — changes propagate everywhere"
  - "/expert reflect temporarily overrides setStatus with progress text — must call restore_status(ctx) in finally block to restore domain tracking"
  - "session_domains Map is module-level state — survives across hooks but must be cleared on session_switch"

