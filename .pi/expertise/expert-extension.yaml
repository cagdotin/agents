domain: expert-extension
description: "Domain expertise extension for pi — manages per-domain mental models as YAML files with lightweight injection"
last_synced: "2026-03-12T15:10:00Z"

scope:
  paths:
    - extensions/expert/

overview: |
  The extension provides persistent, domain-scoped working memory via YAML files in `.pi/expertise/`.
  After simplification, it uses a lightweight listing (name + description per domain) in the
  system prompt instead of auto-injecting full YAML. The agent reads domains on demand via `get`.
  Pinning (`/expert chat`) still injects full YAML for user-selected domains.
  No LLM subprocess calls — all operations are file I/O.

patterns:
  - "Domain listing in system prompt costs ~10-20 tokens per domain; agent calls `get` to read full content when relevant."
  - "Pinned domains inject full YAML via XML blocks in the system prompt."
  - "`append` adds a single item to a YAML list section without touching other content — safer than `update` for incremental learning."
  - "Use `/expert chat` for user-driven pinning, `expertise get` for agent-driven on-demand reads."

design_decisions:
  - reason: "Removed LLM reflection pipeline entirely"
    detail: "LLM-driven rewrites of expertise files produced low-signal updates that corrupted long-lived mental models. Replaced with surgical `append` — agent decides what to add, no risk of dropping existing content."
  - reason: "Replaced auto-injection with lightweight listing"
    detail: "Heuristic matching added 1000-3000+ tokens per turn with unreliable accuracy. A listing costs ~10-20 tokens total and lets the agent decide what to read."
  - reason: "Stripped CONTENT_PRINCIPLES from tool description"
    detail: "~400 tokens of guidance text was in every conversation's tool listing. Moved to system prompt template (AGENTS.md) where it's only present when domains exist. Constant removed entirely from codebase."
  - reason: "Custom toggle list for /expert chat instead of SettingsList"
    detail: "SettingsList shows on/off text on the right — designed for multi-value settings. Replaced with ○/● circles on the left for clearer toggle UX."
  - reason: "Pinned injection unchanged"
    detail: "Pinning is user-explicit — the context cost is intentional and controlled."

gotchas:
  - "The `append` action requires all three params (domain, section, content) — missing any returns an error."
  - "`append` only works on list sections (arrays). Attempting to append to a string section (like `overview`) returns an error suggesting `update` instead."
  - "Empty string sections and null/missing sections are treated as 'create new list' by append_to_section."
  - "Session/pinned domain state is in module-level maps rebuilt from session data; tests must clear `get_pinned_domains()` between runs."
  - "Tool tests need ctx.cwd two levels above the expertise dir — get_expertise_dir(cwd) appends '.pi/expertise', so path.resolve(expertise_dir, '..', '..') is the correct cwd for mocks."
  - "YAML roundtrip via append reformats hand-edited files (comments, key order, whitespace normalized). Documented in README."

references:
  - "Simplification spec: docs/specs/2026-03-12-expert-extension-simplification.md"
  - "Execution plan: docs/exec-plans/active/2026-03-12-expert-extension-simplification.md"
